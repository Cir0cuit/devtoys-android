name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!s}" ]; then
              echo "::error::Secret $s is not set. Refusing to publish an unsigned release."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing-key"
          {
            echo "DEVTOYS_KEYSTORE_FILE=$RUNNER_TEMP/signing-key"
            echo "DEVTOYS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "DEVTOYS_KEY_ALIAS=$KEY_ALIAS"
            echo "DEVTOYS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Test and build release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify signature and prepare assets
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk not found; the release build was not signed."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/DevToys-$VERSION.apk"
          (cd dist && sha256sum "DevToys-$VERSION.apk" > SHA256SUMS.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "DevToys $VERSION" --generate-notes --verify-tag
